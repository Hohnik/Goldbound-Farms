<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f0e8">
<title>Goldbound — The farm atlas</title><meta name="description" content="Explore Pathalerix’s Goldbound farms and experiments through an interactive map of Azeroth.">
<link rel="icon" href="./favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750&display=swap" rel="stylesheet"><link rel="stylesheet" href="./style.css">
<script data-goatcounter="https://goldbound.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>const whTooltips={colorLinks:false,iconizeLinks:false,renameLinks:false};</script><script async src="https://wow.zamimg.com/js/tooltips.js"></script><script type="module" src="./app.js"></script>
</head>
<body>
<header class="topbar">
 <a class="brand" href="#map" aria-label="Goldbound home">goldbound<span>THE FARM ATLAS</span></a>
 <nav id="breadcrumbs" aria-label="Map layers"><span>Azeroth</span></nav>
 <button id="search-open" class="search-launch" aria-label="Search atlas"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>Find a farm or item</span><kbd>⌘ K</kbd></button>
 <button id="reset" class="home-button">World map <span aria-hidden="true">↗</span></button>
</header>
<main id="atlas" class="atlas">
 <section class="map-surface" aria-label="Explore Azeroth">
  <div class="map-intro"><span class="eyebrow" id="layer-label">01 / AZEROTH</span><h1 id="map-title">Azeroth</h1></div>
  <label class="map-layer-control">Map layer<select id="map-layer" aria-label="Map information layer"><option value="coverage">Farm count</option><option value="gph">Recorded GPH</option><option value="prices">Rare loot</option></select></label>
  <div id="map-canvas" class="map-canvas"><svg id="world-map" viewBox="0 0 760 450" role="group" aria-label="Interactive map of Goldbound farm regions"></svg><div id="map-tooltip" class="map-tooltip" hidden></div><div id="loading" class="map-loading" role="status">Opening the atlas…</div></div>
  <div class="map-legend" id="map-legend" aria-live="polite"></div>
  <div class="map-controls"><div class="continent-switch" role="group" aria-label="Choose a continent"><button data-continent="world" aria-pressed="true">Azeroth</button><button data-continent="east" aria-pressed="false">Eastern Kingdoms</button><button data-continent="west" aria-pressed="false">Kalimdor</button></div><div class="offshore" aria-label="Offshore and shared farms"><button data-zone="Vashj’ir">Vashj’ir <span>↗</span></button><button data-zone="Darkmoon Island">Darkmoon Island <span>↗</span></button><button data-zone="Azeroth">Across Azeroth <span>↗</span></button></div></div>
  <button id="mobile-map-toggle" class="mobile-map-toggle" aria-expanded="false">Expand map ↗</button>
  <footer class="map-footer"><span><i></i> Historical field journal <b id="coverage-label"></b></span><span class="credit">Map: <a href="https://commons.wikimedia.org/wiki/File:Eastern_Kingdoms.svg" target="_blank" rel="noopener">Syrio</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a></span></footer>
 </section>
 <aside id="explorer" class="explorer" aria-label="Region explorer" hidden><div class="explorer-toolbar"><button id="back" class="back-button">← Back to map</button><button id="close" class="close-button" aria-label="Close region explorer">×</button></div><div id="explorer-content"></div></aside>
</main>
<dialog id="atlas-search" class="atlas-search" aria-labelledby="atlas-search-title">
 <div class="search-dialog-heading"><div><h2 id="atlas-search-title">Search atlas</h2></div><button id="search-close" class="close-button" aria-label="Close search">×</button></div>
 <label class="sr-only" for="global-search">Search farms, items, or regions</label><input id="global-search" type="search" placeholder="Try Thorium, Papal Fez, or Vashj’ir…" autocomplete="off" aria-controls="global-results">
 <div id="search-result-count" class="sr-only" role="status" aria-live="polite"></div><div id="global-results" class="global-results"></div><p class="search-help">↑ ↓ to browse · Enter to open · Esc to close</p>
</dialog>
<div id="announce" class="sr-only" role="status" aria-live="polite"></div>
</body></html>
